<!DOCTYPE html>
<html> 
<head> 
<title>GeoGebra and JavaScript</title> 
<script src="navigation.js"></script>
<script src="https://www.geogebra.org/apps/deployggb.js"></script>
</head> 
 
<body> 
 <div class="contentBox" id="contentBox">
      <h1>GeoGebra Playing Applet  </h1> 
 
      <p class="text"><br>Using JavaScript listener functions allows communication with GeoGebra. <br>
See <a class="inlineLink" href="https://geogebra.github.io/docs/reference/en/GeoGebra_Apps_API/">GeoGebra JavaScript API</a> for a syntax description of the used methods.
      </p> 
<p></p> 

<div id="ggbApplet"></div>
 
<script type="text/javascript"> 

 
function ggbOnInit(param) {
	
const geoFrame = document.querySelector(".GeoGebraFrame");

const target = geoFrame;

if (target) {
    target.addEventListener("mousemove", handleMouseMove);
}
}
 
function handleMouseMove(event) {
    event = event || window.event; // IE-ism
    ggbApplet.setValue("mouseXporcentaje", ((event.offsetX - 5) / event.target.offsetWidth)); /* 5px to the left, so you can still click on something */
    ggbApplet.setValue("mouseYporcentaje", ((event.offsetY) / event.target.offsetHeight));
ggbApplet.setTextValue("T", target)
}

var parameters = {
"id": "ggbApplet",
"useBrowserForJS":true,
"material_id":"c7gusywx"
}
var applet = new GGBApplet(parameters,true);
      
window.onload = function() {
	applet.inject('ggbApplet');
};

</script> 
     </div>
</body> 
</html>
